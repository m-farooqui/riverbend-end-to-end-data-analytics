services:
  database:
    image: postgres:17-alpine
    container_name: riverbend-postgres
    environment:
      POSTGRES_DB: riverbend
      POSTGRES_USER: riverbend
      POSTGRES_PASSWORD: riverbend
    ports:
      - "55432:5432"
    volumes:
      - riverbend_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riverbend -d riverbend"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: riverbend-backend
    environment:
      DATABASE_URL: postgresql+psycopg://riverbend:riverbend@database:5432/riverbend
    ports:
      - "8000:8000"
    volumes:
      - ../../04_Data_Pipelines_and_Architecture/01_Online_Store_Extraction/raw:/app/exports
      - ../../04_Data_Pipelines_and_Architecture/02_Staging_and_Data_Quality:/app/staging_output
      - ../../05_SQL_and_Data_Models/01_Analytics_Star_Schema/sql:/app/analytics_sql:ro
      - ../../04_Data_Pipelines_and_Architecture/02_Staging_and_Data_Quality:/app/staging_output
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: riverbend-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  riverbend_postgres_data:


